# version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kiddos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiddos_user
      POSTGRES_PASSWORD: kiddos_pass
      POSTGRES_DB: kiddos_db
    ports:
      - '5433:5432'
    volumes:
      - kiddos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kiddos_user -d kiddos_db']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiddos_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kiddos_user:kiddos_pass@postgres:5432/kiddos_db?sslmode=disable
      UPLOAD_DIR: /app/uploads
      PORT: 8000
    ports:
      - '8000:8000'
    volumes:
      # Uploaded images persist on the host, outside the container, so they survive rebuilds/recreation.
      # The host folder defaults to ./public/uploads (where this setup has always stored them); set
      # UPLOAD_HOST_DIR in .env to use another one, e.g. /var/www/kiddosfoods/uploads in production
      # or ./uploads to share files with the non-Docker dev server. URLs stay /uploads/<folder>/<file> either way.
      - ${UPLOAD_HOST_DIR:-./public/uploads}:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kiddos_pgdata:
    driver: local
